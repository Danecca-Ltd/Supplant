<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supplant</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Consolas, sans-serif;
  font-size: 12px;
  background: #1e1e1e;
  color: #d4d4d4;
  display: flex;
  flex-direction: column;
  user-select: none;
}

/* ── Header ── */
#header {
  background: #252526;
  border-bottom: 1px solid #3c3c3c;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
  height: 36px;
}
#header h1 { font-size: 11px; font-weight: 700; color: #cc1111; letter-spacing: 0.15em; white-space: nowrap; }
.hdr-sep  { color: #3c3c3c; font-size: 14px; }
.hdr-chip { font-size: 11px; color: #858585; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr-chip strong { color: #9cdcfe; font-weight: 500; }
.hdr-spacer { flex: 1; }

/* ── Summary bar ── */
#summary-bar {
  background: #2d2d2d;
  border-bottom: 1px solid #3c3c3c;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  height: 28px;
}
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 500;
  border: 1px solid transparent;
}
.pill-mapped  { color: #4ec9b0; border-color: rgba(78,201,176,0.35); background: rgba(78,201,176,0.08); }
.pill-pending { color: #dcdcaa; border-color: rgba(220,220,170,0.35); background: rgba(220,220,170,0.08); }
.pill-auto    { color: #858585; border-color: rgba(133,133,133,0.35); background: rgba(133,133,133,0.08); }
.pill-sep { color: #3c3c3c; margin: 0 2px; }

/* ── Pick banner ── */
#pick-banner {
  display: none;
  background: #1a3a1a;
  border-bottom: 1px solid #3a6a3a;
  color: #4ec9b0;
  font-size: 11px;
  padding: 5px 14px;
  flex-shrink: 0;
}
#pick-banner.visible { display: block; }

/* ── Toolbar ── */
#toolbar {
  background: #252526;
  border-bottom: 1px solid #3c3c3c;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  height: 32px;
}
.filter-btn {
  background: transparent; border: 1px solid transparent;
  color: #858585; border-radius: 3px; padding: 2px 9px;
  cursor: pointer; font-size: 11px; font-family: inherit; transition: all 0.1s;
}
.filter-btn:hover { color: #d4d4d4; border-color: #3c3c3c; }
.filter-btn.active { color: #d4d4d4; background: #37373d; border-color: #3c3c3c; }
.tb-spacer { flex: 1; }

/* ── Table wrap ── */
#table-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; background: #1e1e1e; }

/* ── Table ── */
#ref-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
#ref-table col.c-status { width: 26px; }
#ref-table col.c-name   { width: 24%; }
#ref-table col.c-type   { width: 10%; }
#ref-table col.c-other  { width: auto; }
#ref-table col.c-action { width: 190px; }

#ref-table thead th {
  background: #2d2d2d;
  border-bottom: 2px solid #007acc;
  padding: 3px 6px; font-size: 10px; font-weight: 600;
  letter-spacing: 0.05em; color: #858585; text-align: left;
  white-space: nowrap; position: sticky; top: 0; z-index: 10;
}

#ref-table tbody tr { border-bottom: 1px solid #2a2a2a; cursor: pointer; transition: background 0.08s; }
#ref-table tbody tr:hover { background: #2a2a2a; }
#ref-table tbody tr.row-active { background: #1f3a5a; }
#ref-table tbody tr.row-active:hover { background: #254a72; }
#ref-table tbody tr.row-picking { background: #2d2a0a; }
#ref-table tbody tr.hidden { display: none; }

#ref-table td { padding: 4px 6px; vertical-align: middle; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.td-status  { text-align: center; width: 26px; font-size: 13px; }
.td-name    { color: #d4d4d4; }
.td-type    { color: #858585; font-size: 10px; }
.td-other   { color: #9d9d9d; }
.td-action  { width: 190px; white-space: nowrap; overflow: visible; }

/* Status icons */
.icon-mapped  { color: #4ec9b0; }
.icon-pending { color: #858585; }
.icon-picking { color: #dcdcaa; }

/* Row status flavours */
tr.s-mapped .td-name  { color: #4ec9b0; }
tr.s-pending .td-name { color: #d4d4d4; }

/* Action buttons */
.act-btn {
  font-size: 10px; font-family: inherit; padding: 1px 7px;
  border-radius: 3px; cursor: pointer; border: 1px solid transparent;
  background: #007acc; color: #fff; transition: background 0.1s; white-space: nowrap;
}
.act-btn:hover { background: #0062a3; }
.act-btn.secondary { background: #3c3c3c; color: #9cdcfe; border-color: #555; }
.act-btn.secondary:hover { background: #505050; }
.act-btn:disabled { background: #333; color: #555; cursor: default; }
.act-btn.flip-active { background: #5c3a00; color: #dcdcaa; border-color: #8a6e00; }
.act-btn.flip-active:hover { background: #7a5000; }

.mapped-tag {
  display: inline-block; font-size: 10px; color: #4ec9b0;
  margin-right: 4px; vertical-align: middle;
}

/* Section divider */
tr.section-divider td {
  background: #252526; color: #555; text-align: center; font-size: 10px;
  font-style: italic; padding: 4px 6px;
  border-top: 1px solid #3c3c3c; border-bottom: 1px solid #3c3c3c;
}

/* Midplane group flip button in header */
.cg-flip-btn {
  font-size: 10px; font-family: inherit; padding: 1px 7px;
  border-radius: 3px; cursor: pointer; border: 1px solid #555;
  background: #3c3c3c; color: #9cdcfe; margin-left: 8px;
  vertical-align: middle; transition: background 0.1s;
}
.cg-flip-btn:hover:not(:disabled) { background: #505050; }
.cg-flip-btn:disabled { color: #555; border-color: #3c3c3c; cursor: default; }
.cg-flip-btn.flip-active { background: #5c3a00; color: #dcdcaa; border-color: #8a6e00; }
.cg-flip-btn.flip-active:hover:not(:disabled) { background: #7a5000; }

/* Constraint group header row */
tr.cg-header td {
  background: #272727;
  color: #9cdcfe;
  font-size: 11px; font-weight: 600;
  padding: 4px 6px;
  border-top: 2px solid #3c3c3c;
  cursor: pointer;
  user-select: none;
}
tr.cg-header:hover td { background: #2f2f2f; }
tr.cg-header.cg-all-mapped td { color: #4ec9b0; }
.cg-toggle { font-size: 9px; margin-right: 5px; display: inline-block; width: 10px; }
.cg-count  { font-size: 10px; color: #666; font-weight: 400; margin-left: 4px; }

/* Constraint child rows */
tr.cg-child .td-status { border-left: 2px solid #264f78; }
tr.cg-child .td-name   { padding-left: 10px; }
tr.cg-child.cg-collapsed { display: none !important; }

/* ── Footer ── */
#footer {
  background: #252526; border-top: 1px solid #3c3c3c;
  padding: 0 14px; display: flex; align-items: center;
  gap: 10px; flex-shrink: 0; height: 36px;
}
#status-msg { font-size: 11px; color: #858585; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#execute-btn {
  background: #007acc; border: 1px solid #007acc; color: #fff;
  border-radius: 3px; padding: 3px 16px; cursor: pointer;
  font-size: 11px; font-family: inherit; font-weight: 500; transition: background 0.1s;
  white-space: nowrap;
}
#execute-btn:hover { background: #0062a3; border-color: #0062a3; }
#execute-btn:disabled { background: #3c3c3c; border-color: #3c3c3c; color: #555; cursor: default; }

/* ── Loading / empty ── */
#loading-row td, #empty-row td {
  text-align: center; color: #555; padding: 40px 0; font-size: 12px;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1e1e1e; }
::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #555; }
</style>
</head>
<body>

<div id="header">
  <h1><svg width="11" height="11" viewBox="0 0 10 10" style="vertical-align:middle;margin-right:3px;margin-bottom:1px"><polygon points="5,0.5 9.5,9.5 0.5,9.5" fill="none" stroke="#cc1111" stroke-width="1.2" stroke-linejoin="miter"/></svg>SUPPLANT</h1>
  <span class="hdr-sep">|</span>
  <div class="hdr-chip">From: <strong id="hdr-orig">&#8212;</strong></div>
  <span class="hdr-sep">|</span>
  <div class="hdr-chip">To: <strong id="hdr-repl">&#8212;</strong></div>
  <span class="hdr-spacer"></span>
</div>

<div id="summary-bar">
  <span class="pill pill-mapped">&#10003; <span id="cnt-mapped">0</span> mapped</span>
  <span class="pill-sep">|</span>
  <span class="pill pill-pending">&#9675; <span id="cnt-pending">0</span> pending</span>
  <span class="pill-sep">|</span>
  <span class="pill pill-auto">&#8667; <span id="cnt-auto">0</span> auto</span>
</div>

<div id="pick-banner">
  &#9654; Pick mode active &#8212; click a face or edge on the replacement component.
</div>

<div id="toolbar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="pending">Pending only</button>
  <span class="tb-spacer"></span>
</div>

<div id="table-wrap">
  <table id="ref-table">
    <colgroup>
      <col class="c-status">
      <col class="c-name">
      <col class="c-type">
      <col class="c-other">
      <col class="c-action">
    </colgroup>
    <thead>
      <tr>
        <th></th>
        <th>Reference</th>
        <th>Geometry</th>
        <th>Connects to</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr id="loading-row"><td colspan="5" id="loading-msg">JS loading&#8230;</td></tr>
    </tbody>
  </table>
</div>

<div id="footer">
  <span id="status-msg">Select original and replacement, then click OK in the Supplant dialog.</span>
  <button id="execute-btn" disabled>Execute Supplant</button>
</div>

<script>
(function () {
'use strict';

/* Confirm JS is running */
(function() {
  var el = document.getElementById('loading-msg');
  if (el) el.textContent = 'JS OK \u2014 waiting for Python data\u2026';
})();

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sendAction(action, data) {
  try { adsk.fusionSendData(action, data != null ? String(data) : ''); }
  catch(e) { console.error('adsk send error', e); }
}

function setStatus(msg) { document.getElementById('status-msg').textContent = msg || ''; }

/* -- State -- */
var state = {
  joints:       [],   // mixed: [{kind:"joint",...}] or [{kind:"constraint_group", items:[...]}]
  done:         {},   // token \u2192 geom_desc string
  flips:        {},   // token \u2192 bool (manual flip override active)
  orig:         '',
  repl:         '',
  auto:         0,
  pickingToken: null,
  activeToken:  null,
  filter:       'all'
};

/* Returns flat array of all individually-pickable items (joints + constraint rels). */
function allPickableItems() {
  var out = [];
  state.joints.forEach(function(item) {
    if (!item.kind || item.kind === 'joint') {
      out.push(item);
    } else if (item.kind === 'constraint_group') {
      (item.items || []).forEach(function(r) { out.push(r); });
    }
  });
  return out;
}

/* -- Render -- */
function renderAll() {
  renderSummary();
  renderTable();
  updateExecuteBtn();
}

function renderSummary() {
  document.getElementById('hdr-orig').textContent = state.orig || '\u2014';
  document.getElementById('hdr-repl').textContent = state.repl || '\u2014';
  var items   = allPickableItems();
  var mapped  = items.filter(function(i) { return !!state.done[i.token]; }).length;
  var pending = items.length - mapped;
  document.getElementById('cnt-mapped').textContent  = mapped;
  document.getElementById('cnt-pending').textContent = pending;
  document.getElementById('cnt-auto').textContent    = state.auto;
}

/* Build a single pickable row (<tr>) for a joint or a constraint rel child. */
function buildPickableRow(j, isChild) {
  var isMapped  = !!state.done[j.token];
  var isPicking = state.pickingToken === j.token;
  var isActive  = state.activeToken  === j.token;

  var tr = document.createElement('tr');
  tr.dataset.token = j.token;
  if (isChild)  tr.classList.add('cg-child');
  if (isMapped) tr.classList.add('s-mapped'); else tr.classList.add('s-pending');
  if (isActive)  tr.classList.add('row-active');
  if (isPicking) tr.classList.add('row-picking');

  var statusTd = document.createElement('td');
  statusTd.className = 'td-status';
  if (isPicking)     statusTd.innerHTML = '<span class="icon-picking">&#8987;</span>';
  else if (isMapped) statusTd.innerHTML = '<span class="icon-mapped">&#10003;</span>';
  else               statusTd.innerHTML = '<span class="icon-pending">&#9675;</span>';
  tr.appendChild(statusTd);

  var nameTd = document.createElement('td');
  nameTd.className = 'td-name';
  nameTd.textContent = j.name;
  nameTd.title = j.name;
  tr.appendChild(nameTd);

  var typeTd = document.createElement('td');
  typeTd.className = 'td-type';
  if (!isChild) typeTd.textContent = j.type || '';
  tr.appendChild(typeTd);

  var otherTd = document.createElement('td');
  otherTd.className = 'td-other';
  otherTd.textContent = j.other || '';
  otherTd.title = j.other || '';
  tr.appendChild(otherTd);

  var actTd = document.createElement('td');
  actTd.className = 'td-action';
  if (isPicking) {
    actTd.innerHTML = '<span style="color:#dcdcaa;font-size:10px">Picking&#x2026;</span>';
  } else if (isMapped) {
    var tag = document.createElement('span');
    tag.className = 'mapped-tag';
    tag.textContent = '\u2192 ' + (state.done[j.token] || '');
    actTd.appendChild(tag);
    var rbtn = document.createElement('button');
    rbtn.className = 'act-btn secondary';
    rbtn.textContent = 'Re-pick';
    rbtn.dataset.token = j.token;
    rbtn.addEventListener('click', function(e) { e.stopPropagation(); startPick(this.dataset.token); });
    actTd.appendChild(rbtn);
    if (!j.no_flip) {
      var fbtn = document.createElement('button');
      var isFlipActive = !!state.flips[j.token];
      fbtn.className = 'act-btn secondary flip-btn' + (isFlipActive ? ' flip-active' : '');
      fbtn.title = 'Toggle constraint direction (flip)';
      fbtn.textContent = '\u21c5';
      fbtn.dataset.token = j.token;
      fbtn.addEventListener('click', function(e) {
        e.stopPropagation();
        sendAction('toggle_flip', JSON.stringify({ token: this.dataset.token }));
      });
      actTd.appendChild(fbtn);
    }
  } else {
    var pbtn = document.createElement('button');
    pbtn.className = 'act-btn';
    pbtn.textContent = 'Pick \u2192';
    pbtn.dataset.token = j.token;
    pbtn.addEventListener('click', function(e) { e.stopPropagation(); startPick(this.dataset.token); });
    actTd.appendChild(pbtn);
  }
  tr.appendChild(actTd);

  tr.addEventListener('click', function() {
    var tok = this.dataset.token;
    state.activeToken = (state.activeToken === tok) ? null : tok;
    renderTable();
    if (state.activeToken) sendAction('set_active_joint', JSON.stringify({ token: tok }));
  });

  return tr;
}

/* Render a constraint_group header + its child rel rows into frag. */
function renderConstraintGroup(frag, group) {
  var children  = group.items || [];
  var allMapped = children.length > 0 && children.every(function(c) { return !!state.done[c.token]; });

  if (state.filter === 'pending' && allMapped) return;

  var headerTr = document.createElement('tr');
  headerTr.className = 'cg-header' + (allMapped ? ' cg-all-mapped' : '');

  var headerTd = document.createElement('td');
  headerTd.colSpan = 5;
  headerTd.innerHTML =
    '<span class="cg-toggle">&#9660;</span> ' + esc(group.name) +
    ' <span class="cg-count">(' + children.length + ')</span>';

  /* Midplane groups get a single shared flip button on the header.
     Enabled only when all child picks are done (both references selected). */
  if (group.is_midplane) {
    var flipToks    = group.midplane_flip_tokens || [];
    var flipEnabled = allMapped;
    var flipActive  = !!group.midplane_flip_active ||
                      flipToks.some(function(t) { return !!state.flips[t]; });
    var cgFlipBtn = document.createElement('button');
    cgFlipBtn.className = 'cg-flip-btn' + (flipActive ? ' flip-active' : '');
    cgFlipBtn.title   = flipEnabled
      ? 'Flip midplane direction'
      : 'Pick all references first to enable flip';
    cgFlipBtn.textContent = '⇅ Flip';
    cgFlipBtn.disabled = !flipEnabled;
    cgFlipBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      sendAction('toggle_midplane_flip', JSON.stringify({ tokens: flipToks }));
    });
    headerTd.appendChild(cgFlipBtn);
  }

  headerTr.appendChild(headerTd);
  frag.appendChild(headerTr);

  var childTrs = [];
  children.forEach(function(rel) {
    var isMapped = !!state.done[rel.token];
    var tr = buildPickableRow(rel, true);
    if (state.filter === 'pending' && isMapped) tr.classList.add('hidden');
    frag.appendChild(tr);
    childTrs.push(tr);
  });

  /* Collapse toggle \u2014 click group header to expand/collapse children */
  var collapsed = false;
  headerTr.addEventListener('click', function() {
    collapsed = !collapsed;
    var toggle = headerTr.querySelector('.cg-toggle');
    if (toggle) toggle.innerHTML = collapsed ? '&#9654;' : '&#9660;';
    childTrs.forEach(function(tr) {
      tr.classList.toggle('cg-collapsed', collapsed);
    });
  });
}

function renderTable() {
  var tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  var allItems = allPickableItems();
  if (!allItems.length) {
    var etr = document.createElement('tr');
    etr.id = 'empty-row';
    var etd = document.createElement('td');
    etd.colSpan = 5;
    etd.textContent = 'No joint references found. Click Execute to swap.';
    etr.appendChild(etd);
    tbody.appendChild(etr);
    return;
  }

  var frag = document.createDocumentFragment();
  state.joints.forEach(function(item) {
    if (!item.kind || item.kind === 'joint') {
      var isMapped = !!state.done[item.token];
      var tr = buildPickableRow(item, false);
      if (state.filter === 'pending' && isMapped) tr.classList.add('hidden');
      frag.appendChild(tr);
    } else if (item.kind === 'constraint_group') {
      renderConstraintGroup(frag, item);
    }
  });
  tbody.appendChild(frag);
}

function updateExecuteBtn() {
  var items   = allPickableItems();
  var mapped  = items.filter(function(i) { return !!state.done[i.token]; }).length;
  document.getElementById('execute-btn').disabled = (mapped < items.length);
}

function startPick(token) {
  if (state.pickingToken) return;
  state.pickingToken = token;
  document.getElementById('pick-banner').classList.add('visible');
  renderTable();
  setStatus('Pick mode \u2014 click a face or edge on \'' + state.repl + '\'.');
  sendAction('start_pick', JSON.stringify({ token: token }));
}

/* -- Filter buttons -- */
try {
  var filterBtns = document.querySelectorAll('.filter-btn');
  Array.prototype.forEach.call(filterBtns, function(btn) {
    btn.addEventListener('click', function() {
      state.filter = this.dataset.filter;
      Array.prototype.forEach.call(document.querySelectorAll('.filter-btn'), function(b) {
        b.classList.toggle('active', b.dataset.filter === state.filter);
      });
      renderTable();
    });
  });
} catch(e) {
  var lm2 = document.getElementById('loading-msg');
  if (lm2) lm2.textContent = 'JS ERROR (filter): ' + e.message;
}

/* -- Execute -- */
try {
  document.getElementById('execute-btn').addEventListener('click', function() {
    this.disabled = true;
    setStatus('Executing\u2026');
    sendAction('execute', '{}');
  });
} catch(e2) {
  var lm3 = document.getElementById('loading-msg');
  if (lm3) lm3.textContent = 'JS ERROR (exec): ' + e2.message;
}

/* -- Fusion bridge -- */
window.fusionJavaScriptHandler = {
  handle: function(action, dataStr) {
    var data = {};
    try { data = JSON.parse(dataStr || '{}'); } catch(e) {}

    if (action === 'data') {
      var lm = document.getElementById('loading-msg');
      if (lm) lm.textContent = 'data received \u2014 ' + (data.joints || []).length + ' item(s)';
      state.orig   = data.orig || '';
      state.repl   = data.repl || '';
      state.auto   = data.auto || 0;
      state.done   = {};
      state.flips  = {};
      state.joints = data.joints || [];
      /* Restore done and flip overrides from pre-mapped items. */
      allPickableItems().forEach(function(j) {
        if (j.mapped && j.mapped_geom) state.done[j.token] = j.mapped_geom;
        if (j.flip_override) state.flips[j.token] = true;
      });
      state.pickingToken = null;
      state.activeToken  = null;
      document.getElementById('pick-banner').classList.remove('visible');
      var items = allPickableItems();
      if (!items.length) {
        setStatus('No references found \u2014 click Execute to swap the component.');
      } else {
        setStatus(items.length + ' reference(s) found. Click a row to highlight, then Pick \u2192 to map.');
      }
      renderAll();

    } else if (action === 'pick_result') {
      state.done[data.token] = data.geom || 'face';
      if (state.pickingToken === data.token) {
        state.pickingToken = null;
        document.getElementById('pick-banner').classList.remove('visible');
      }
      renderAll();
      var items  = allPickableItems();
      var mapped = items.filter(function(i) { return !!state.done[i.token]; }).length;
      if (mapped >= items.length) {
        setStatus('All ' + items.length + ' reference(s) mapped. Click Execute Supplant.');
      } else {
        setStatus((items.length - mapped) + ' reference(s) remaining.');
      }

    } else if (action === 'pick_error') {
      state.pickingToken = null;
      document.getElementById('pick-banner').classList.remove('visible');
      renderTable();
      setStatus('\u26a0 ' + (data.message || 'Pick error.'));

    } else if (action === 'pick_cancel') {
      state.pickingToken = null;
      document.getElementById('pick-banner').classList.remove('visible');
      renderTable();
      setStatus('Pick cancelled.');

    } else if (action === 'flip_toggled') {
      state.flips[data.token] = !!data.flipped;
      /* Update just the flip button without full re-render. */
      var allBtns = document.querySelectorAll('.flip-btn');
      for (var bi = 0; bi < allBtns.length; bi++) {
        if (allBtns[bi].dataset.token === data.token) {
          if (data.flipped) {
            allBtns[bi].classList.add('flip-active');
          } else {
            allBtns[bi].classList.remove('flip-active');
          }
          break;
        }
      }

    } else if (action === 'midplane_flip_toggled') {
      /* Update flip state for all midplane tokens and re-render the group. */
      (data.tokens || []).forEach(function(tok) {
        state.flips[tok] = !!data.flipped;
      });
      /* Propagate active state back into the group data so renderConstraintGroup
         picks it up without a full state reload. */
      state.joints.forEach(function(item) {
        if (item.kind === 'constraint_group' && item.is_midplane) {
          var toks = item.midplane_flip_tokens || [];
          if (toks.some(function(t) { return (data.tokens || []).indexOf(t) >= 0; })) {
            item.midplane_flip_active = !!data.flipped;
          }
        }
      });
      renderTable();

    } else if (action === 'highlight_error') {
      setStatus('\u26a0 Could not highlight this reference on the original component.');

    } else if (action === 'execute_result') {
      setStatus(data.report || 'Done.');
      document.getElementById('execute-btn').disabled = true;
      state.done   = {};
      state.flips  = {};
      state.joints = [];
      state.orig = state.repl = '';
      renderSummary();
    }
  }
};

/* Signal Fusion that the page is ready. Retry until the bridge is available. */
var _readySent = false;
function _sendReady() {
  if (_readySent) return;
  try { adsk.fusionSendData('ready', '{}'); _readySent = true; }
  catch(e) {}
}
_sendReady();
setTimeout(_sendReady, 150);
setTimeout(_sendReady, 500);
setTimeout(_sendReady, 1200);


})();
</script>
</body>
</html>
